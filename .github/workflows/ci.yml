name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Game Unit Tests
        run: pnpm --filter @mfd/game test

      - name: Game Data Unit Tests
        run: pnpm --filter @mfd/game-data test

      - name: Workspace TypeScript Checks
        run: pnpm typecheck

      - name: Workspace Production Build
        run: pnpm build
